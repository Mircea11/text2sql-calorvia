        name: ecriture
        description: Écritures comptables (en-têtes de pièces) Somme credit-debit
          des comptes 70, à la période comptable. Les autres produits 74 ne sont pas
          du chiffre d'affaires. Le facturé ERP et le comptabilisé peuvent différer.
          Somme credit-debit des classes 6 et 7, hors comptes d'affectation 69 et
          79. Inclure le bénéfice à reporter 693000 annulerait artificiellement le
          résultat déjà affecté. Convention vérifiée pour ce laboratoire ; somme credit-debit
          des produits 7 hors affectation 79 et des charges 60, 61, 62. Les dotations/reprises
          63 et charges financières 65 sont exclues. Les autres produits 74 sont inclus
          dans EBITDA. Marge = EBITDA / chiffre d'affaires 70, pas / tous les produits
          7. Utiliser period_month pour la période de paie et payment_date pour la
          date de paiement. Les charges comptables peuvent comporter des écritures
          manuelles hors paie. Aucune rémunération, commission ou fiche de paie individuelle
          n'est diffusée dans ce démonstrateur sans identité RH vérifiée ; seules
          les statistiques agrégées sont permises.
